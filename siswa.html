<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Siswa — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<!-- Modal Form Siswa -->
<div class="modal-backdrop" id="siswaModal">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h3 id="siswaModalTitle">Tambah Siswa</h3>
      <button class="modal-close" onclick="closeModal('siswaModal')">✕</button>
    </div>
    <form id="siswaForm">
      <div class="modal-body">
        <input type="hidden" id="siswaId" />
        <div class="form-grid">
          <div class="field">
            <label>NIS</label>
            <input type="text" id="fNis" required />
          </div>
          <div class="field">
            <label>Nama Lengkap</label>
            <input type="text" id="fNama" required />
          </div>
          <div class="field">
            <label>Kelas</label>
            <select id="fKelas" required></select>
          </div>
          <div class="field">
            <label>Jenis Kelamin</label>
            <select id="fJk" required>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div class="field">
            <label>Tempat Lahir</label>
            <input type="text" id="fTempatLahir" />
          </div>
          <div class="field">
            <label>Tanggal Lahir</label>
            <input type="date" id="fTglLahir" />
          </div>
          <div class="field full">
            <label>Alamat</label>
            <input type="text" id="fAlamat" />
          </div>
          <div class="field">
            <label>No. Telepon</label>
            <input type="text" id="fTelepon" />
          </div>
          <div class="field">
            <label>Nama Orang Tua/Wali</label>
            <input type="text" id="fNamaOrtu" />
          </div>
          <div class="field">
            <label>Status</label>
            <select id="fStatus">
              <option value="Aktif">Aktif</option>
              <option value="Pindah">Pindah</option>
              <option value="Lulus">Lulus</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('siswaModal')">Batal</button>
        <button type="submit" class="btn btn-blue">💾 Simpan Data</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detail Siswa -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Detail Siswa</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('detailModal')">Tutup</button>
    </div>
  </div>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = renderShell("siswa", "Data Siswa", "Kelola data induk siswa SMP Hulnani");
if (session) {
  const content = document.getElementById("pageContent");
  const isAdmin = session.role === "admin";

  let searchTerm = "";
  let filterKelas = "";
  let currentPage = 1;
  const PAGE_SIZE = 8;

  function getKelasOptions() {
    return DB.get("kelas").map(k => k.nama);
  }

  function populateKelasSelect(selectEl, selected) {
    const kelasList = getKelasOptions();
    selectEl.innerHTML = kelasList.map(k => `<option value="${k}" ${k===selected?"selected":""}>${k}</option>`).join("");
  }

  function renderToolbar() {
    const kelasOptions = getKelasOptions();
    return `
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <span class="ic">🔍</span>
            <input type="text" id="searchInput" placeholder="Cari nama atau NIS..." value="${escapeHtml(searchTerm)}" />
          </div>
          <select class="select-filter" id="filterKelas">
            <option value="">Semua Kelas</option>
            ${kelasOptions.map(k => `<option value="${k}" ${filterKelas===k?"selected":""}>${k}</option>`).join("")}
          </select>
        </div>
        ${isAdmin ? `<button class="btn btn-blue" id="btnAddSiswa">➕ Tambah Siswa</button>` : ""}
      </div>
    `;
  }

  function statusBadge(status) {
    const map = { Aktif: "badge-green", Pindah: "badge-orange", Lulus: "badge-blue", Nonaktif: "badge-red" };
    return `<span class="badge ${map[status]||"badge-gray"}">${status}</span>`;
  }

  function renderTable() {
    let data = DB.get("siswa");
    if (filterKelas) data = data.filter(s => s.kelas === filterKelas);
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      data = data.filter(s => s.nama.toLowerCase().includes(q) || s.nis.includes(q));
    }
    const total = data.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const pageData = data.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    const rows = pageData.map(s => `
      <tr>
        <td>
          <div class="table-avatar">
            <div class="avatar">${initials(s.nama)}</div>
            <div>
              <div class="tname">${escapeHtml(s.nama)}</div>
              <div class="tsub">NIS: ${escapeHtml(s.nis)}</div>
            </div>
          </div>
        </td>
        <td>${escapeHtml(s.kelas)}</td>
        <td>${s.jk === "L" ? "Laki-laki" : "Perempuan"}</td>
        <td>${escapeHtml(s.telepon || "-")}</td>
        <td>${statusBadge(s.status)}</td>
        <td>
          <div class="row-actions">
            <button class="action-btn" title="Detail" onclick="viewSiswa('${s.id}')">👁️</button>
            ${isAdmin ? `<button class="action-btn" title="Edit" onclick="editSiswa('${s.id}')">✏️</button>
            <button class="action-btn danger" title="Hapus" onclick="deleteSiswa('${s.id}')">🗑️</button>` : ""}
          </div>
        </td>
      </tr>
    `).join("");

    const tableHtml = total === 0
      ? `<div class="empty-state"><div class="ic">🧑‍🎓</div>Tidak ada data siswa yang ditemukan.</div>`
      : `<table>
          <thead><tr><th>Nama Siswa</th><th>Kelas</th><th>Jenis Kelamin</th><th>Telepon</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

    const paginationHtml = `
      <div class="pagination">
        <span>Menampilkan ${total === 0 ? 0 : (currentPage-1)*PAGE_SIZE+1}-${Math.min(currentPage*PAGE_SIZE,total)} dari ${total} data</span>
        <div class="pg-btns">
          <button ${currentPage===1?"disabled":""} onclick="goPage(${currentPage-1})">‹</button>
          ${Array.from({length: totalPages}, (_,i)=>i+1).map(p => `<button class="${p===currentPage?"active":""}" onclick="goPage(${p})">${p}</button>`).join("")}
          <button ${currentPage===totalPages?"disabled":""} onclick="goPage(${currentPage+1})">›</button>
        </div>
      </div>
    `;

    return `<div class="table-wrap">${tableHtml}${total>0?paginationHtml:""}</div>`;
  }

  function fullRender() {
    content.innerHTML = renderToolbar() + renderTable();
    bindEvents();
  }

  function bindEvents() {
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", debounce((e) => {
      searchTerm = e.target.value;
      currentPage = 1;
      fullRender();
      document.getElementById("searchInput").focus();
      const val = searchInput.value;
      document.getElementById("searchInput").setSelectionRange(val.length, val.length);
    }, 300));

    document.getElementById("filterKelas").addEventListener("change", (e) => {
      filterKelas = e.target.value;
      currentPage = 1;
      fullRender();
    });

    const addBtn = document.getElementById("btnAddSiswa");
    if (addBtn) addBtn.addEventListener("click", () => openSiswaForm());
  }

  window.goPage = function(p) { currentPage = p; fullRender(); };

  window.openSiswaForm = function(siswa) {
    document.getElementById("siswaForm").reset();
    populateKelasSelect(document.getElementById("fKelas"), siswa ? siswa.kelas : "");
    if (siswa) {
      document.getElementById("siswaModalTitle").textContent = "Edit Data Siswa";
      document.getElementById("siswaId").value = siswa.id;
      document.getElementById("fNis").value = siswa.nis;
      document.getElementById("fNama").value = siswa.nama;
      document.getElementById("fJk").value = siswa.jk;
      document.getElementById("fTempatLahir").value = siswa.tempatLahir || "";
      document.getElementById("fTglLahir").value = siswa.tglLahir || "";
      document.getElementById("fAlamat").value = siswa.alamat || "";
      document.getElementById("fTelepon").value = siswa.telepon || "";
      document.getElementById("fNamaOrtu").value = siswa.namaOrtu || "";
      document.getElementById("fStatus").value = siswa.status || "Aktif";
    } else {
      document.getElementById("siswaModalTitle").textContent = "Tambah Siswa";
      document.getElementById("siswaId").value = "";
    }
    openModal("siswaModal");
  };

  window.editSiswa = function(id) {
    const s = DB.findById("siswa", id);
    if (s) openSiswaForm(s);
  };

  window.viewSiswa = function(id) {
    const s = DB.findById("siswa", id);
    if (!s) return;
    document.getElementById("detailBody").innerHTML = `
      <div class="flex gap-12" style="align-items:center; margin-bottom:18px;">
        <div class="avatar" style="width:56px;height:56px;font-size:18px;">${initials(s.nama)}</div>
        <div>
          <div style="font-weight:700; font-size:16px;">${escapeHtml(s.nama)}</div>
          <div class="text-muted" style="font-size:12.5px;">NIS ${escapeHtml(s.nis)} • Kelas ${escapeHtml(s.kelas)}</div>
        </div>
      </div>
      <table style="width:100%; font-size:13px;">
        <tr><td class="text-muted" style="padding:6px 0; width:40%;">Jenis Kelamin</td><td>${s.jk==="L"?"Laki-laki":"Perempuan"}</td></tr>
        <tr><td class="text-muted" style="padding:6px 0;">Tempat, Tgl Lahir</td><td>${escapeHtml(s.tempatLahir||"-")}, ${formatDate(s.tglLahir)}</td></tr>
        <tr><td class="text-muted" style="padding:6px 0;">Alamat</td><td>${escapeHtml(s.alamat||"-")}</td></tr>
        <tr><td class="text-muted" style="padding:6px 0;">No. Telepon</td><td>${escapeHtml(s.telepon||"-")}</td></tr>
        <tr><td class="text-muted" style="padding:6px 0;">Orang Tua/Wali</td><td>${escapeHtml(s.namaOrtu||"-")}</td></tr>
        <tr><td class="text-muted" style="padding:6px 0;">Status</td><td>${statusBadge(s.status)}</td></tr>
      </table>
    `;
    openModal("detailModal");
  };

  window.deleteSiswa = function(id) {
    const s = DB.findById("siswa", id);
    confirmDialog({
      title: "Hapus Data Siswa?",
      message: `Data siswa "${s ? s.nama : ""}" akan dihapus permanen dan tidak dapat dikembalikan.`,
      confirmText: "Ya, Hapus",
      onConfirm: () => {
        DB.remove("siswa", id);
        showToast("Data siswa berhasil dihapus.", "success");
        fullRender();
      },
    });
  };

  document.getElementById("siswaForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("siswaId").value;
    const payload = {
      nis: document.getElementById("fNis").value.trim(),
      nama: document.getElementById("fNama").value.trim(),
      kelas: document.getElementById("fKelas").value,
      jk: document.getElementById("fJk").value,
      tempatLahir: document.getElementById("fTempatLahir").value.trim(),
      tglLahir: document.getElementById("fTglLahir").value,
      alamat: document.getElementById("fAlamat").value.trim(),
      telepon: document.getElementById("fTelepon").value.trim(),
      namaOrtu: document.getElementById("fNamaOrtu").value.trim(),
      status: document.getElementById("fStatus").value,
    };
    if (id) {
      DB.update("siswa", id, payload);
      showToast("Data siswa berhasil diperbarui.", "success");
    } else {
      DB.insert("siswa", payload);
      showToast("Data siswa berhasil ditambahkan.", "success");
    }
    closeModal("siswaModal");
    fullRender();
  });

  fullRender();
}
</script>
</body>
</html>
