<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nilai Akademik — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<div class="modal-backdrop" id="nilaiModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="nilaiModalTitle">Input Nilai</h3>
      <button class="modal-close" onclick="closeModal('nilaiModal')">✕</button>
    </div>
    <form id="nilaiForm">
      <div class="modal-body">
        <input type="hidden" id="nilaiId" />
        <div class="field">
          <label>Siswa</label>
          <select id="fSiswa" required></select>
        </div>
        <div class="field">
          <label>Mata Pelajaran</label>
          <select id="fMapel" required></select>
        </div>
        <div class="field">
          <label>Jenis Penilaian</label>
          <select id="fJenis" required>
            <option value="Tugas">Tugas</option>
            <option value="UH1">Ulangan Harian 1</option>
            <option value="UH2">Ulangan Harian 2</option>
            <option value="UTS">UTS</option>
            <option value="UAS">UAS</option>
          </select>
        </div>
        <div class="field">
          <label>Nilai (0-100)</label>
          <input type="number" id="fNilai" min="0" max="100" required />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('nilaiModal')">Batal</button>
        <button type="submit" class="btn btn-blue">💾 Simpan Nilai</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = Auth.requireLogin();
if (session) {
  const canEdit = session.role === "admin" || session.role === "guru";
  renderShell("nilai", "Nilai Akademik", canEdit ? "Kelola nilai akademik siswa per mata pelajaran" : "Lihat rekap nilai akademik Anda");
  const content = document.getElementById("pageContent");

  let filterKelas = "";
  let filterMapel = "";
  let searchTerm = "";

  function populateSiswaSelect(selected) {
    const siswa = DB.get("siswa").filter(s => s.status === "Aktif");
    document.getElementById("fSiswa").innerHTML = siswa.map(s =>
      `<option value="${s.id}" ${s.id===selected?"selected":""}>${escapeHtml(s.nama)} (${escapeHtml(s.kelas)})</option>`
    ).join("");
  }

  function populateMapelSelect(selected) {
    const mapel = DB.get("mapel");
    document.getElementById("fMapel").innerHTML = mapel.map(m =>
      `<option value="${m.id}" ${m.id===selected?"selected":""}>${escapeHtml(m.nama)}</option>`
    ).join("");
  }

  function renderToolbar() {
    const kelasList = DB.get("kelas");
    const mapelList = DB.get("mapel");
    return `
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <span class="ic">🔍</span>
            <input type="text" id="searchInput" placeholder="Cari nama siswa..." value="${escapeHtml(searchTerm)}" />
          </div>
          <select class="select-filter" id="filterKelas">
            <option value="">Semua Kelas</option>
            ${kelasList.map(k => `<option value="${escapeHtml(k.nama)}" ${filterKelas===k.nama?"selected":""}>${escapeHtml(k.nama)}</option>`).join("")}
          </select>
          <select class="select-filter" id="filterMapel">
            <option value="">Semua Mapel</option>
            ${mapelList.map(m => `<option value="${m.id}" ${filterMapel===m.id?"selected":""}>${escapeHtml(m.nama)}</option>`).join("")}
          </select>
        </div>
        ${canEdit ? `<button class="btn btn-blue" id="btnAddNilai">➕ Input Nilai</button>` : ""}
      </div>
    `;
  }

  function nilaiBadge(nilai, kkm) {
    return nilai >= kkm
      ? `<span class="badge badge-green">${nilai}</span>`
      : `<span class="badge badge-red">${nilai}</span>`;
  }

  function renderTable() {
    let nilaiData = DB.get("nilai");
    const siswaList = DB.get("siswa");
    const mapelList = DB.get("mapel");

    if (session.role === "siswa") {
      nilaiData = nilaiData.filter(n => n.siswaId === session.linkedId);
    }
    if (filterMapel) nilaiData = nilaiData.filter(n => n.mapelId === filterMapel);

    // enrich
    let enriched = nilaiData.map(n => {
      const s = siswaList.find(x => x.id === n.siswaId) || {};
      const m = mapelList.find(x => x.id === n.mapelId) || {};
      return Object.assign({}, n, { _siswaNama: s.nama || "-", _kelas: s.kelas || "-", _mapelNama: m.nama || "-", _kkm: m.kkm || 75 });
    });

    if (filterKelas) enriched = enriched.filter(n => n._kelas === filterKelas);
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      enriched = enriched.filter(n => n._siswaNama.toLowerCase().includes(q));
    }

    enriched.sort((a,b) => a._siswaNama.localeCompare(b._siswaNama));

    if (enriched.length === 0) {
      return `<div class="table-wrap"><div class="empty-state"><div class="ic">📝</div>Belum ada data nilai yang tercatat.</div></div>`;
    }

    const rows = enriched.map(n => `
      <tr>
        <td>
          <div class="table-avatar">
            <div class="avatar">${initials(n._siswaNama)}</div>
            <div>
              <div class="tname">${escapeHtml(n._siswaNama)}</div>
              <div class="tsub">${escapeHtml(n._kelas)}</div>
            </div>
          </div>
        </td>
        <td>${escapeHtml(n._mapelNama)}</td>
        <td><span class="badge badge-gray">${escapeHtml(n.jenis)}</span></td>
        <td>${nilaiBadge(n.nilai, n._kkm)}</td>
        <td>${escapeHtml(n.semester)} ${escapeHtml(n.tahunAjaran)}</td>
        ${canEdit ? `<td>
          <div class="row-actions">
            <button class="action-btn" title="Edit" onclick="editNilai('${n.id}')">✏️</button>
            <button class="action-btn danger" title="Hapus" onclick="deleteNilai('${n.id}')">🗑️</button>
          </div>
        </td>` : ""}
      </tr>
    `).join("");

    return `<div class="table-wrap">
      <table>
        <thead><tr><th>Siswa</th><th>Mapel</th><th>Jenis</th><th>Nilai</th><th>Periode</th>${canEdit?"<th>Aksi</th>":""}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  function fullRender() {
    content.innerHTML = renderToolbar() + renderTable();
    document.getElementById("searchInput").addEventListener("input", debounce((e) => {
      searchTerm = e.target.value;
      fullRender();
      const input = document.getElementById("searchInput");
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }, 300));
    document.getElementById("filterKelas").addEventListener("change", (e) => { filterKelas = e.target.value; fullRender(); });
    document.getElementById("filterMapel").addEventListener("change", (e) => { filterMapel = e.target.value; fullRender(); });
    const addBtn = document.getElementById("btnAddNilai");
    if (addBtn) addBtn.addEventListener("click", () => openNilaiForm());
  }

  window.openNilaiForm = function(nilai) {
    document.getElementById("nilaiForm").reset();
    populateSiswaSelect(nilai ? nilai.siswaId : "");
    populateMapelSelect(nilai ? nilai.mapelId : "");
    if (nilai) {
      document.getElementById("nilaiModalTitle").textContent = "Edit Nilai";
      document.getElementById("nilaiId").value = nilai.id;
      document.getElementById("fJenis").value = nilai.jenis;
      document.getElementById("fNilai").value = nilai.nilai;
    } else {
      document.getElementById("nilaiModalTitle").textContent = "Input Nilai";
      document.getElementById("nilaiId").value = "";
    }
    openModal("nilaiModal");
  };

  window.editNilai = function(id) {
    const n = DB.findById("nilai", id);
    if (n) openNilaiForm(n);
  };

  window.deleteNilai = function(id) {
    confirmDialog({
      title: "Hapus Data Nilai?",
      message: "Data nilai ini akan dihapus permanen.",
      confirmText: "Ya, Hapus",
      onConfirm: () => {
        DB.remove("nilai", id);
        showToast("Data nilai berhasil dihapus.", "success");
        fullRender();
      },
    });
  };

  document.getElementById("nilaiForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("nilaiId").value;
    const settings = DB.get("settings");
    const payload = {
      siswaId: document.getElementById("fSiswa").value,
      mapelId: document.getElementById("fMapel").value,
      jenis: document.getElementById("fJenis").value,
      nilai: Number(document.getElementById("fNilai").value),
      semester: settings.semester,
      tahunAjaran: settings.tahunAjaran,
    };
    if (id) {
      DB.update("nilai", id, payload);
      showToast("Nilai berhasil diperbarui.", "success");
    } else {
      DB.insert("nilai", payload);
      showToast("Nilai berhasil ditambahkan.", "success");
    }
    closeModal("nilaiModal");
    fullRender();
  });

  fullRender();
}
</script>
</body>
</html>
