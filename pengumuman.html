<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pengumuman — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<div class="modal-backdrop" id="pengumumanModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="pengumumanModalTitle">Buat Pengumuman</h3>
      <button class="modal-close" onclick="closeModal('pengumumanModal')">✕</button>
    </div>
    <form id="pengumumanForm">
      <div class="modal-body">
        <input type="hidden" id="pengumumanId" />
        <div class="field">
          <label>Judul</label>
          <input type="text" id="fJudul" required />
        </div>
        <div class="field">
          <label>Kategori</label>
          <select id="fKategori">
            <option value="Umum">Umum</option>
            <option value="Akademik">Akademik</option>
            <option value="Kegiatan">Kegiatan</option>
            <option value="Penting">Penting</option>
          </select>
        </div>
        <div class="field">
          <label>Isi Pengumuman</label>
          <textarea id="fIsi" rows="5" required></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('pengumumanModal')">Batal</button>
        <button type="submit" class="btn btn-blue">📣 Terbitkan</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = Auth.requireLogin();
if (session) {
  const canEdit = session.role === "admin" || session.role === "guru";
  renderShell("pengumuman", "Pengumuman", "Info dan pengumuman terbaru dari sekolah");
  const content = document.getElementById("pageContent");

  const KATEGORI_BADGE = { Umum: "badge-gray", Akademik: "badge-blue", Kegiatan: "badge-green", Penting: "badge-red" };

  function renderList() {
    const data = [...DB.get("pengumuman")].sort((a,b) => b.tanggal.localeCompare(a.tanggal));
    if (data.length === 0) {
      return `<div class="table-wrap"><div class="empty-state"><div class="ic">📣</div>Belum ada pengumuman.</div></div>`;
    }
    return data.map(p => `
      <div class="card" style="margin-bottom:14px;">
        <div class="flex-between" style="align-items:flex-start; margin-bottom:10px;">
          <div>
            <div class="flex gap-8" style="align-items:center; margin-bottom:6px;">
              <span class="badge ${KATEGORI_BADGE[p.kategori]||'badge-gray'}">${escapeHtml(p.kategori)}</span>
              <span class="text-muted" style="font-size:12px;">${formatDate(p.tanggal)} • oleh ${escapeHtml(p.penulis)}</span>
            </div>
            <h3 style="margin:0; font-size:16px;">${escapeHtml(p.judul)}</h3>
          </div>
          ${canEdit ? `
            <div class="row-actions">
              <button class="action-btn" title="Edit" onclick="editPengumuman('${p.id}')">✏️</button>
              <button class="action-btn danger" title="Hapus" onclick="deletePengumuman('${p.id}')">🗑️</button>
            </div>` : ""}
        </div>
        <p style="margin:0; font-size:13.5px; line-height:1.7; color:var(--text-main);">${escapeHtml(p.isi)}</p>
      </div>
    `).join("");
  }

  function fullRender() {
    content.innerHTML = `
      ${canEdit ? `<div class="toolbar"><div></div><button class="btn btn-blue" id="btnAddPengumuman">➕ Buat Pengumuman</button></div>` : ""}
      ${renderList()}
    `;
    const addBtn = document.getElementById("btnAddPengumuman");
    if (addBtn) addBtn.addEventListener("click", () => openForm());
  }

  window.openForm = function(item) {
    document.getElementById("pengumumanForm").reset();
    if (item) {
      document.getElementById("pengumumanModalTitle").textContent = "Edit Pengumuman";
      document.getElementById("pengumumanId").value = item.id;
      document.getElementById("fJudul").value = item.judul;
      document.getElementById("fKategori").value = item.kategori;
      document.getElementById("fIsi").value = item.isi;
    } else {
      document.getElementById("pengumumanModalTitle").textContent = "Buat Pengumuman";
      document.getElementById("pengumumanId").value = "";
    }
    openModal("pengumumanModal");
  };

  window.editPengumuman = function(id) {
    const p = DB.findById("pengumuman", id);
    if (p) openForm(p);
  };

  window.deletePengumuman = function(id) {
    confirmDialog({
      title: "Hapus Pengumuman?",
      message: "Pengumuman ini akan dihapus permanen.",
      confirmText: "Ya, Hapus",
      onConfirm: () => {
        DB.remove("pengumuman", id);
        showToast("Pengumuman berhasil dihapus.", "success");
        fullRender();
      },
    });
  };

  document.getElementById("pengumumanForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("pengumumanId").value;
    const payload = {
      judul: document.getElementById("fJudul").value.trim(),
      kategori: document.getElementById("fKategori").value,
      isi: document.getElementById("fIsi").value.trim(),
    };
    if (id) {
      DB.update("pengumuman", id, payload);
      showToast("Pengumuman berhasil diperbarui.", "success");
    } else {
      payload.tanggal = new Date().toISOString().slice(0,10);
      payload.penulis = session.name;
      DB.insert("pengumuman", payload);
      showToast("Pengumuman berhasil diterbitkan.", "success");
    }
    closeModal("pengumumanModal");
    fullRender();
  });

  fullRender();
}
</script>
</body>
</html>
