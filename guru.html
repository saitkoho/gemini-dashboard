<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Guru — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<div class="modal-backdrop" id="guruModal">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h3 id="guruModalTitle">Tambah Guru</h3>
      <button class="modal-close" onclick="closeModal('guruModal')">✕</button>
    </div>
    <form id="guruForm">
      <div class="modal-body">
        <input type="hidden" id="guruId" />
        <div class="form-grid">
          <div class="field">
            <label>NIP</label>
            <input type="text" id="fNip" required />
          </div>
          <div class="field">
            <label>Nama Lengkap</label>
            <input type="text" id="fNama" required />
          </div>
          <div class="field">
            <label>Jenis Kelamin</label>
            <select id="fJk">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div class="field">
            <label>Mata Pelajaran</label>
            <select id="fMapel"></select>
          </div>
          <div class="field">
            <label>No. Telepon</label>
            <input type="text" id="fTelepon" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="fEmail" />
          </div>
          <div class="field full">
            <label>Alamat</label>
            <input type="text" id="fAlamat" />
          </div>
          <div class="field">
            <label>Wali Kelas</label>
            <select id="fWaliKelas">
              <option value="">- Bukan Wali Kelas -</option>
            </select>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="fStatus">
              <option value="Aktif">Aktif</option>
              <option value="Cuti">Cuti</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('guruModal')">Batal</button>
        <button type="submit" class="btn btn-blue">💾 Simpan Data</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = Auth.requireRole(["admin"]);
if (session) {
  renderShell("guru", "Data Guru", "Kelola data guru dan tenaga pendidik");
  const content = document.getElementById("pageContent");

  let searchTerm = "";
  let currentPage = 1;
  const PAGE_SIZE = 8;

  function populateMapelSelect(selected) {
    const mapel = DB.get("mapel");
    document.getElementById("fMapel").innerHTML = mapel.map(m => `<option value="${escapeHtml(m.nama)}" ${m.nama===selected?"selected":""}>${escapeHtml(m.nama)}</option>`).join("");
  }

  function populateWaliKelasSelect(selected) {
    const kelas = DB.get("kelas");
    const sel = document.getElementById("fWaliKelas");
    sel.innerHTML = `<option value="">- Bukan Wali Kelas -</option>` +
      kelas.map(k => `<option value="${escapeHtml(k.nama)}" ${k.nama===selected?"selected":""}>${escapeHtml(k.nama)}</option>`).join("");
  }

  function statusBadge(status) {
    const map = { Aktif: "badge-green", Cuti: "badge-orange", Nonaktif: "badge-red" };
    return `<span class="badge ${map[status]||"badge-gray"}">${status}</span>`;
  }

  function renderToolbar() {
    return `
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <span class="ic">🔍</span>
            <input type="text" id="searchInput" placeholder="Cari nama atau NIP..." value="${escapeHtml(searchTerm)}" />
          </div>
        </div>
        <button class="btn btn-blue" id="btnAddGuru">➕ Tambah Guru</button>
      </div>
    `;
  }

  function renderTable() {
    let data = DB.get("guru");
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      data = data.filter(g => g.nama.toLowerCase().includes(q) || g.nip.includes(q));
    }
    const total = data.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const pageData = data.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    const rows = pageData.map(g => `
      <tr>
        <td>
          <div class="table-avatar">
            <div class="avatar">${initials(g.nama)}</div>
            <div>
              <div class="tname">${escapeHtml(g.nama)}</div>
              <div class="tsub">NIP: ${escapeHtml(g.nip)}</div>
            </div>
          </div>
        </td>
        <td>${escapeHtml(g.mapel)}</td>
        <td>${g.waliKelas ? escapeHtml(g.waliKelas) : "-"}</td>
        <td>${escapeHtml(g.telepon || "-")}</td>
        <td>${statusBadge(g.status)}</td>
        <td>
          <div class="row-actions">
            <button class="action-btn" title="Edit" onclick="editGuru('${g.id}')">✏️</button>
            <button class="action-btn danger" title="Hapus" onclick="deleteGuru('${g.id}')">🗑️</button>
          </div>
        </td>
      </tr>
    `).join("");

    const tableHtml = total === 0
      ? `<div class="empty-state"><div class="ic">🧑‍🏫</div>Tidak ada data guru yang ditemukan.</div>`
      : `<table>
          <thead><tr><th>Nama Guru</th><th>Mata Pelajaran</th><th>Wali Kelas</th><th>Telepon</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

    const paginationHtml = `
      <div class="pagination">
        <span>Menampilkan ${total === 0 ? 0 : (currentPage-1)*PAGE_SIZE+1}-${Math.min(currentPage*PAGE_SIZE,total)} dari ${total} data</span>
        <div class="pg-btns">
          <button ${currentPage===1?"disabled":""} onclick="goPage(${currentPage-1})">‹</button>
          ${Array.from({length: totalPages}, (_,i)=>i+1).map(p => `<button class="${p===currentPage?"active":""}" onclick="goPage(${p})">${p}</button>`).join("")}
          <button ${currentPage===totalPages?"disabled":""} onclick="goPage(${currentPage+1})">›</button>
        </div>
      </div>
    `;

    return `<div class="table-wrap">${tableHtml}${total>0?paginationHtml:""}</div>`;
  }

  function fullRender() {
    content.innerHTML = renderToolbar() + renderTable();
    document.getElementById("searchInput").addEventListener("input", debounce((e) => {
      searchTerm = e.target.value;
      currentPage = 1;
      fullRender();
      const input = document.getElementById("searchInput");
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }, 300));
    document.getElementById("btnAddGuru").addEventListener("click", () => openGuruForm());
  }

  window.goPage = function(p) { currentPage = p; fullRender(); };

  window.openGuruForm = function(guru) {
    document.getElementById("guruForm").reset();
    populateMapelSelect(guru ? guru.mapel : "");
    populateWaliKelasSelect(guru ? guru.waliKelas : "");
    if (guru) {
      document.getElementById("guruModalTitle").textContent = "Edit Data Guru";
      document.getElementById("guruId").value = guru.id;
      document.getElementById("fNip").value = guru.nip;
      document.getElementById("fNama").value = guru.nama;
      document.getElementById("fJk").value = guru.jk;
      document.getElementById("fTelepon").value = guru.telepon || "";
      document.getElementById("fEmail").value = guru.email || "";
      document.getElementById("fAlamat").value = guru.alamat || "";
      document.getElementById("fStatus").value = guru.status || "Aktif";
    } else {
      document.getElementById("guruModalTitle").textContent = "Tambah Guru";
      document.getElementById("guruId").value = "";
    }
    openModal("guruModal");
  };

  window.editGuru = function(id) {
    const g = DB.findById("guru", id);
    if (g) openGuruForm(g);
  };

  window.deleteGuru = function(id) {
    const g = DB.findById("guru", id);
    confirmDialog({
      title: "Hapus Data Guru?",
      message: `Data guru "${g ? g.nama : ""}" akan dihapus permanen.`,
      confirmText: "Ya, Hapus",
      onConfirm: () => {
        DB.remove("guru", id);
        showToast("Data guru berhasil dihapus.", "success");
        fullRender();
      },
    });
  };

  document.getElementById("guruForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("guruId").value;
    const payload = {
      nip: document.getElementById("fNip").value.trim(),
      nama: document.getElementById("fNama").value.trim(),
      jk: document.getElementById("fJk").value,
      mapel: document.getElementById("fMapel").value,
      telepon: document.getElementById("fTelepon").value.trim(),
      email: document.getElementById("fEmail").value.trim(),
      alamat: document.getElementById("fAlamat").value.trim(),
      waliKelas: document.getElementById("fWaliKelas").value,
      status: document.getElementById("fStatus").value,
    };
    if (id) {
      DB.update("guru", id, payload);
      showToast("Data guru berhasil diperbarui.", "success");
    } else {
      DB.insert("guru", payload);
      showToast("Data guru berhasil ditambahkan.", "success");
    }
    closeModal("guruModal");
    fullRender();
  });

  fullRender();
}
</script>
</body>
</html>
