<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil Saya — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = Auth.requireRole(["guru", "siswa"]);
if (session) {
  renderShell("profil", "Profil Saya", "Informasi akun dan data pribadi Anda");
  const content = document.getElementById("pageContent");

  function renderGuruProfile() {
    const g = DB.findById("guru", session.linkedId);
    if (!g) return `<div class="card"><div class="empty-state">Data guru tidak ditemukan.</div></div>`;
    return `
      <div class="grid-2">
        <div class="card">
          <div class="flex gap-12" style="align-items:center; margin-bottom:20px;">
            <div class="avatar" style="width:64px;height:64px;font-size:20px;">${initials(g.nama)}</div>
            <div>
              <div style="font-weight:800; font-size:18px;">${escapeHtml(g.nama)}</div>
              <div class="text-muted" style="font-size:13px;">Guru ${escapeHtml(g.mapel)}</div>
            </div>
          </div>
          <table style="width:100%; font-size:13.5px;">
            <tr><td class="text-muted" style="padding:8px 0; width:38%;">NIP</td><td>${escapeHtml(g.nip)}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Jenis Kelamin</td><td>${g.jk==='L'?'Laki-laki':'Perempuan'}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Mata Pelajaran</td><td>${escapeHtml(g.mapel)}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Wali Kelas</td><td>${g.waliKelas ? escapeHtml(g.waliKelas) : '-'}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">No. Telepon</td><td>${escapeHtml(g.telepon||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Email</td><td>${escapeHtml(g.email||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Alamat</td><td>${escapeHtml(g.alamat||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Status</td><td><span class="badge badge-green">${escapeHtml(g.status)}</span></td></tr>
          </table>
        </div>
        <div class="card">
          <div class="card-head"><div><h3>Ganti Kata Sandi</h3><p>Perbarui kata sandi login Anda</p></div></div>
          <form id="passForm">
            <div class="field"><label>Kata Sandi Baru</label><input type="password" id="newPass" minlength="4" required /></div>
            <div class="field"><label>Konfirmasi Kata Sandi</label><input type="password" id="confPass" minlength="4" required /></div>
            <button type="submit" class="btn btn-blue" style="width:100%;">🔒 Perbarui Kata Sandi</button>
          </form>
        </div>
      </div>
    `;
  }

  function renderSiswaProfile() {
    const s = DB.findById("siswa", session.linkedId);
    if (!s) return `<div class="card"><div class="empty-state">Data siswa tidak ditemukan.</div></div>`;
    return `
      <div class="grid-2">
        <div class="card">
          <div class="flex gap-12" style="align-items:center; margin-bottom:20px;">
            <div class="avatar" style="width:64px;height:64px;font-size:20px;">${initials(s.nama)}</div>
            <div>
              <div style="font-weight:800; font-size:18px;">${escapeHtml(s.nama)}</div>
              <div class="text-muted" style="font-size:13px;">Kelas ${escapeHtml(s.kelas)} • NIS ${escapeHtml(s.nis)}</div>
            </div>
          </div>
          <table style="width:100%; font-size:13.5px;">
            <tr><td class="text-muted" style="padding:8px 0; width:38%;">Jenis Kelamin</td><td>${s.jk==='L'?'Laki-laki':'Perempuan'}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Tempat, Tgl Lahir</td><td>${escapeHtml(s.tempatLahir||'-')}, ${formatDate(s.tglLahir)}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Alamat</td><td>${escapeHtml(s.alamat||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">No. Telepon</td><td>${escapeHtml(s.telepon||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Orang Tua/Wali</td><td>${escapeHtml(s.namaOrtu||'-')}</td></tr>
            <tr><td class="text-muted" style="padding:8px 0;">Status</td><td><span class="badge badge-green">${escapeHtml(s.status)}</span></td></tr>
          </table>
        </div>
        <div class="card">
          <div class="card-head"><div><h3>Ganti Kata Sandi</h3><p>Perbarui kata sandi login Anda</p></div></div>
          <form id="passForm">
            <div class="field"><label>Kata Sandi Baru</label><input type="password" id="newPass" minlength="4" required /></div>
            <div class="field"><label>Konfirmasi Kata Sandi</label><input type="password" id="confPass" minlength="4" required /></div>
            <button type="submit" class="btn btn-blue" style="width:100%;">🔒 Perbarui Kata Sandi</button>
          </form>
        </div>
      </div>
    `;
  }

  content.innerHTML = session.role === "guru" ? renderGuruProfile() : renderSiswaProfile();

  const passForm = document.getElementById("passForm");
  if (passForm) {
    passForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const newPass = document.getElementById("newPass").value;
      const confPass = document.getElementById("confPass").value;
      if (newPass !== confPass) {
        showToast("Konfirmasi kata sandi tidak cocok.", "error");
        return;
      }
      DB.update("users", session.id, { password: newPass });
      showToast("Kata sandi berhasil diperbarui.", "success");
      passForm.reset();
    });
  }
}
</script>
</body>
</html>
