<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pengaturan — Sistem Digital SMP Hulnani</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app-shell" id="appShell"></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
const session = Auth.requireRole(["admin"]);
if (session) {
  renderShell("pengaturan", "Pengaturan", "Kelola profil sekolah dan konfigurasi sistem");
  const content = document.getElementById("pageContent");

  function render() {
    const s = DB.get("settings");
    const users = DB.get("users");

    content.innerHTML = `
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><div><h3>Profil Sekolah</h3><p>Informasi umum yang tampil di sistem</p></div></div>
          <form id="settingsForm">
            <div class="form-grid">
              <div class="field full"><label>Nama Sekolah</label><input type="text" id="fNamaSekolah" value="${escapeHtml(s.namaSekolah)}" required /></div>
              <div class="field"><label>NPSN</label><input type="text" id="fNpsn" value="${escapeHtml(s.npsn)}" /></div>
              <div class="field"><label>Telepon</label><input type="text" id="fTelepon" value="${escapeHtml(s.telepon)}" /></div>
              <div class="field full"><label>Alamat</label><input type="text" id="fAlamat" value="${escapeHtml(s.alamat)}" /></div>
              <div class="field"><label>Email</label><input type="email" id="fEmail" value="${escapeHtml(s.email)}" /></div>
              <div class="field"><label>Kepala Sekolah</label><input type="text" id="fKepsek" value="${escapeHtml(s.kepsek)}" /></div>
              <div class="field"><label>Tahun Ajaran</label><input type="text" id="fTahunAjaran" value="${escapeHtml(s.tahunAjaran)}" /></div>
              <div class="field">
                <label>Semester</label>
                <select id="fSemester">
                  <option value="Ganjil" ${s.semester==='Ganjil'?'selected':''}>Ganjil</option>
                  <option value="Genap" ${s.semester==='Genap'?'selected':''}>Genap</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-blue" style="margin-top:6px;">💾 Simpan Perubahan</button>
          </form>
        </div>

        <div class="card">
          <div class="card-head"><div><h3>Manajemen Data</h3><p>Cadangkan atau kembalikan data sistem</p></div></div>
          <p class="text-muted" style="font-size:13px; line-height:1.7;">
            Seluruh data (siswa, guru, nilai, absensi, dll) tersimpan secara lokal di browser ini.
            Ekspor data secara berkala untuk mencegah kehilangan data, atau impor data cadangan yang pernah diekspor.
          </p>
          <div class="flex gap-12" style="margin-bottom:12px;">
            <button class="btn btn-outline" id="btnExport">⬇️ Ekspor Data (JSON)</button>
            <button class="btn btn-outline" id="btnImportTrigger">⬆️ Impor Data</button>
            <input type="file" id="importFile" accept="application/json" class="hidden" />
          </div>
          <div style="border-top:1px dashed var(--border); margin:16px 0; padding-top:16px;">
            <button class="btn btn-danger-outline" id="btnResetData">⚠️ Reset ke Data Awal</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="card-head"><div><h3>Akun Pengguna</h3><p>Daftar akun login pada sistem</p></div></div>
        <div class="table-wrap" style="box-shadow:none; border:none;">
          <table>
            <thead><tr><th>Nama</th><th>Username</th><th>Peran</th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td class="tname">${escapeHtml(u.name)}</td>
                  <td>${escapeHtml(u.username)}</td>
                  <td><span class="badge badge-blue">${u.role}</span></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById("settingsForm").addEventListener("submit", (e) => {
      e.preventDefault();
      DB.updateSettings({
        namaSekolah: document.getElementById("fNamaSekolah").value.trim(),
        npsn: document.getElementById("fNpsn").value.trim(),
        telepon: document.getElementById("fTelepon").value.trim(),
        alamat: document.getElementById("fAlamat").value.trim(),
        email: document.getElementById("fEmail").value.trim(),
        kepsek: document.getElementById("fKepsek").value.trim(),
        tahunAjaran: document.getElementById("fTahunAjaran").value.trim(),
        semester: document.getElementById("fSemester").value,
      });
      showToast("Profil sekolah berhasil diperbarui.", "success");
      render();
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      const data = DB.get();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup-smphulnani-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Data berhasil diekspor.", "success");
    });

    document.getElementById("btnImportTrigger").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          DB.save(data);
          showToast("Data berhasil diimpor. Memuat ulang halaman...", "success");
          setTimeout(() => window.location.reload(), 1000);
        } catch (err) {
          showToast("File tidak valid.", "error");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("btnResetData").addEventListener("click", () => {
      confirmDialog({
        title: "Reset Seluruh Data?",
        message: "Semua data akan dikembalikan ke kondisi awal (data demo). Tindakan ini tidak dapat dibatalkan.",
        confirmText: "Ya, Reset",
        onConfirm: () => {
          DB.reset();
          showToast("Data berhasil direset.", "success");
          setTimeout(() => window.location.reload(), 800);
        },
      });
    });
  }

  render();
}
</script>
</body>
</html>
